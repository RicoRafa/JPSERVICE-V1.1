<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICCOSS | BEBIDAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel ="stylesheet" href ="styles.css">
</head>
<body>
    <header>
      <button class = "back-link" onclick="window.location.href='index.html'"> VOLVER </button>

      <h1 class="page-title">BEBIDAS</h1>
    </header>
    

    <div class="grid">

        <div class="card" id="card-0" data-price="40.0">
          <div class="img-placeholder">
            <img src="assets/CocaCola.png" alt="Imagen de cocacola">
          </div>
          <h3 class="item-name">Coca-Cola</h3>
          <p class="item-desc">500ml.</p>
          <div class="qty-row">
            <div class="qty-control">
              <button type="button" onclick="changeQty(0, -1)">−</button>
              <span id="qty-0">1</span>
              <button type="button" onclick="changeQty(0, 1)">+</button>
            </div>
            <span class="price" id="price-0">$40.00</span>
          </div>
          <button type="button" class="order-btn" id="btn-0" onclick="orderItem(0, 'CocaCola')">Ordenar</button>
        </div>

        <div class="card" id="card-1" data-price="40.0">
          <div class="img-placeholder">
            <img src="assets/Agua.png" alt="Imagen de agualimon">
          </div>
          <h3 class="item-name">Agua de limón</h3>
          <p class="item-desc">Vaso de 435ml.</p>
          <div class="qty-row">
            <div class="qty-control">
              <button type="button" onclick="changeQty(1, -1)">−</button>
              <span id="qty-1">1</span>
              <button type="button" onclick="changeQty(1, 1)">+</button>
            </div>
            <span class="price" id="price-1">$40.00</span>
          </div>
          <button type="button" class="order-btn" id="btn-1" onclick="orderItem(1, 'Agua de limon')">Ordenar</button>
        </div>

        <div class="card" id="card-2" data-price="130.0">
          <div class="img-placeholder">
            <img src="assets/Margarita.png" alt="Imagen de margarita">
          </div>
          <h3 class="item-name">Margarita Frozen</h3>
          <p class="item-desc">Tequila, licor de naranja, jugo de limón y hielo.</p>
          <div class="qty-row">
            <div class="qty-control">
              <button type="button" onclick="changeQty(2, -1)">−</button>
              <span id="qty-2">1</span>
              <button type="button" onclick="changeQty(2, 1)">+</button>
            </div>
            <span class="price" id="price-2">$130.00</span>
          </div>
          <button type="button" class="order-btn" id="btn-2" onclick="orderItem(2, 'Margarita Frozen')">Ordenar</button>
        </div>
    </div>

    <script src ="restaurante.js"></script>
    
</body>
</html>
